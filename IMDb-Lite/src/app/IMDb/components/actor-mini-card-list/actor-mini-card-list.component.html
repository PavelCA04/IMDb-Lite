<div class="w-full">
  <p-dataview [value]="actors" [rows]="6" [paginator]="true" [pageLinks]="3" [style]="{ fontSize: '10pt' }" 
    class="text-center">
    <ng-template #list let-items>
      <div class="grid grid-cols-3 divide-y-2 divide-[transparent]">
        <div *ngFor="let item of items">
          <div class="flex flex-row items-center py-4 rounded-md shadow-lg dark:bg-transparent gap-5">
            <img class="w-16 h-16 object-cover rounded-full " [src]="item.image" [alt]="item.text" />
            <div class="flex flex-col gap-2 w-full text-left">
              <h2 class="text-sm">{{ item.text }}</h2>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
</div>
