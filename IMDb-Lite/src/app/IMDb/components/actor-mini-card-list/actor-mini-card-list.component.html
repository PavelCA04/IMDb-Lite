<div class="sm:w-[38%] md:w-[32%] lg:w-[27%] xl:w-[22%]">
  <p-dataview [value]="items" [rows]="4" [paginator]="true" [pageLinks]="2" [style]="{ fontSize: '10pt' }" 
    class="text-center">
    <ng-template #list let-items>
      <div class="grid grid-cols-1 m-2 divide-y-2 divide-[#cfcfcf22]">
        <div *ngFor="let item of items">
          <div class="flex flex-row items-center p-4 rounded-md shadow-lg dark:bg-transparent gap-5">
            <img class="w-16 h-16 object-cover rounded-full " [src]="item.image" [alt]="item.text" />
            <div class="flex flex-col gap-2 w-full text-left">
              <h2 class="text-sm">{{ item.text }}</h2>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
</div>
