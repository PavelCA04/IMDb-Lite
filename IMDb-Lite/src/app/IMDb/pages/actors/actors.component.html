<div class="flex flex-col space-y-6">
  <div>
    <shared-main-header></shared-main-header>
  </div>

  <div class="flex flex-wrap items-center justify-between p-0 bg-grey-300 rounded-md shadow">
    <div class="flex space-x-4 ml-4">

      <div class="flex flex-col space-y-1">
        <label for="order" class="text-md font-medium mb-2 text-center">Order</label>
        <p-select [options]="orderOptions" [(ngModel)]="selectedOrder" placeholder="Select order"
          class="w-64 h-full min-h-[40px]" (onChange)="onOrderChange($event)" variant="filled"></p-select>
      </div>

      <div class="flex flex-col space-y-1" style="margin-left: 1.5rem;">
        <label for="year" class="text-md font-medium mb-2 text-center">Year</label>
        <p-datepicker [(ngModel)]="selectedYear" [iconDisplay]="'input'" view="year" dateFormat="yy"
          placeholder="Select year" class="w-64 h-full min-h-[40px]" [showIcon]="true" [minDate]="minYear"
          [maxDate]="maxYear" variant="filled" (onSelect)="onYearSelect($event)"></p-datepicker>
      </div>
    </div>


    <!-- Right Controls: Search Bar and Add Button -->
    <div class="flex items-center space-x-2 pr-4 h-full">
      <!-- Search Bar -->
      <div class="flex flex-col space-y-1">
        <label for="rating" class="text-md font-medium text-center mb-2">Search</label>
        <div class="relative flex items-center h-full w-full">
          <p-floatLabel variant="on" class="w-full">
            <input type="text" id="search" pInputText placeholder=" " [(ngModel)]="searchQuery"
              class="w-full p-2 pl-10 border rounded-md h-full min-h-[40px]" variant="filled" />
            <label for="search" class="pl-6">Search actors</label>
          </p-floatLabel>
          <!-- Search Icon -->
          <i class="pi pi-search absolute left-3 text-gray-500"></i>
        </div>
      </div>

      <!-- Add Button -->
      <div class="flex flex-col space-y-1">
        <label for="rating" class="text-md font-medium text-center mb-2">Add</label>
        <button pButton icon="pi pi-plus" class="glass h-full min-h-[40px]"></button>
      </div>
    </div>

  </div>

  <!-- Card List Section -->
  <div>
    <shared-card-list [cards]="filteredCards"></shared-card-list>
  </div>
</div>
