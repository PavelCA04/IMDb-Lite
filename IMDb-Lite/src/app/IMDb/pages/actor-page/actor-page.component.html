<div class="relative w-full h-[17rem] overflow-hidden">
  <shared-main-header></shared-main-header>
</div>

<div class="relative z-10 -mt-28 mx-20 flex flex-row gap-10 mb-10">

  <div class="flex flex-col gap-6 items-center flex-none basis-3/12">
    <img src="{{imgPath}}" alt=""
      class="w-48 h-48 rounded-full object-cover">
    <div class="flex flex-col gap-3 text-center">
      <h1 class="text-3xl font-bold">{{ actor?.name }}</h1>
      <p class="text-xs uppercase">{{ actor?.birth_date | date:'MMMM d, y' }}</p>
      <div class="flex flex-row gap-3 justify-center mt-3">
        <button pButton icon="pi pi-pencil" class="glass h-12 w-12 rounded-full" [routerLink]="['/actors/edit', actorName]"></button>
        <shared-delete-btn></shared-delete-btn>
      </div>
    </div>
  </div>

  <div class="mt-36 w-full">
    <p-card class="w-full">
      <p-tabs value="0" class="p-3">
        <p-tablist>
          <p-tab value="0">About</p-tab>
          <p-tab value="1">Portfolio</p-tab>
          <p-tab value="2">Gallery</p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel value="0">
            <p class="m-0 mt-5 px-[1.3rem] text-sm">{{ actor?.biography }}</p>
          </p-tabpanel>
          <p-tabpanel value="1">
            <p class="m-0 mt-5 px-[1.3rem]">
              <movie-mini-card-list [movies]="actor?.movies"></movie-mini-card-list>
            </p>
          </p-tabpanel>
          <p-tabpanel value="2">
            <p class="m-0 mt-5">
              <shared-gallery [images]="images"></shared-gallery>
            </p>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </p-card>
  </div>

</div>
