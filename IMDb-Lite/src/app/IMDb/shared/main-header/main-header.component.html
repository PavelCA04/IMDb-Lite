
<div class="header">
    <div class="logo">
      <img src="path_to_logo" alt="Logo" />
    </div>
    <div class="logout">
      <button pButton label="Logout"  [rounded]="true" [raised]="true" icon="pi pi-sign-out" severity="danger"> </button>
    </div>
  </div>
  
  <p-carousel
    [value]="carouselItems"
    [numVisible]="1"
    [circular]="true"
    [autoplayInterval]="3000"
    [showIndicators]="true"
    [showNavigators]="false"
    class="custom-carousel"
  >
    <ng-template pTemplate="item" let-item>
      <div class="carousel-content">
        <img [src]="item.image" alt="{{ item.title }}" class="carousel-image" />
        <div class="carousel-info">
          <h1>{{ item.title }}</h1>
          <p>{{ item.description }}</p>
          <button pButton label="Details"  [rounded]="true" [raised]="true" severity="info"></button>
        </div>
      </div>
    </ng-template>
  </p-carousel>
